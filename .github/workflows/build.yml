name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release step creates the tag and the draft release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Only used by Azure Trusted Signing (see "Set up Windows signing").
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Code signing. Each block does nothing until its secrets are added in the repo's
      # Settings > Secrets and variables > Actions (see "Signing the installers" in the README),
      # so unsigned builds keep working in the meantime.
      - name: Set up Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $conf = 'src-tauri/tauri.conf.json'
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          if ($env:WINDOWS_CERTIFICATE) {
            # A .pfx certificate (OV or EV from a certificate authority), stored base64-encoded.
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            $json.bundle.windows | Add-Member -Force certificateThumbprint $cert.Thumbprint
            Write-Host "Signing with certificate for $($cert.Subject)"
          } elseif ($env:AZURE_SIGNING_ENDPOINT) {
            # Azure Trusted Signing; needs AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID too.
            cargo install trusted-signing-cli --locked
            $cmd = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE -d `"Motown AI`" %1"
            $json.bundle.windows | Add-Member -Force signCommand $cmd
            Write-Host "Signing with Azure Trusted Signing"
          } else {
            Write-Host "::warning::No Windows signing secrets set; the installers will be unsigned and SmartScreen will warn."
            exit 0
          }
          $json | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple signing secrets set; macOS will say the app is from an unidentified developer."
            exit 0
          fi
          # Tauri signs and notarizes when these are in the environment.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && { echo "$v<<__END__"; echo "${!v}"; echo "__END__"; } >> "$GITHUB_ENV"
          done
      # Every push to main (and any v* tag) updates a draft GitHub release for the app's version
      # with the installers attached; pull requests keep them as build artifacts.
      - name: Build (release)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Motown AI v__VERSION__"
          releaseBody: "Download the installer for your computer below: the .exe for Windows, the .dmg for macOS."
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Build
        if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
        with:
          name: motown-ai-${{ matrix.os }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
