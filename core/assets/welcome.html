<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · Motown AI</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg-primary, #0d1117); color: var(--text-primary, #e6e6ef); font-family: var(--font-body, "DM Sans", system-ui, sans-serif); }
  .card { width: min(440px, calc(100vw - 48px)); padding: 40px 32px; text-align: center; animation: rise 260ms cubic-bezier(.23, 1, .32, 1) both; }
  .logo { display: block; height: 40px; margin: 0 auto 28px; }
  h1 { font-family: var(--font-display, inherit); font-size: 26px; letter-spacing: -.01em; margin: 0 0 10px; }
  p { color: var(--text-muted, #a3a3b5); line-height: 1.55; margin: 0 0 28px; }
  .wait { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--border, rgba(255,255,255,.1)); font-weight: 500; font-size: 14px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #7c6cfa); animation: pulse 1.6s ease-out infinite; }
  .wait.on .pulse { background: #2fbf71; animation: none; }
  button { margin-top: 16px; background: none; border: 0; color: var(--text-muted, #a3a3b5); font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 70% { opacity: .35; transform: scale(.9); } 100% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .card, .pulse { animation: none; } }
</style>
</head>
<body data-mdk-welcome>
  <main class="card">
    <img class="logo" src="/static/images/new-logo-dark.png" alt="Motown AI" onerror="this.style.display='none'">
    <h1>Welcome to Motown AI</h1>
    <p>Connect to the internet once to sign in. After that, your packs live on this computer and open without internet.</p>
    <div class="wait" id="wait" role="status" aria-live="polite"><span class="pulse"></span><span id="msg">Waiting for a connection…</span></div>
    <div><button type="button" onclick="check()">Try again</button></div>
  </main>
<script>
  function check() {
    fetch('/__desktop/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      if (s.online) {
        document.getElementById('wait').classList.add('on');
        document.getElementById('msg').textContent = 'Connected. Opening Motown AI…';
        setTimeout(function () { location.replace('/dashboard'); }, 400);
      }
    }).catch(function () {});
  }
  setInterval(check, 3000);
  window.addEventListener('online', check);
</script>
</body>
</html>
