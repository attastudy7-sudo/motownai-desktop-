<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Motown AI</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg-primary, #0d1117); color: var(--text-primary, #e6e6ef); font-family: var(--font-body, "DM Sans", system-ui, sans-serif); }
  .card { max-width: 420px; padding: 32px; text-align: center; }
  h1 { font-family: var(--font-display, inherit); font-size: 22px; margin: 0 0 8px; }
  p { color: var(--text-muted, #a3a3b5); line-height: 1.5; margin: 0 0 20px; }
  .row { display: flex; gap: 12px; justify-content: center; }
  a { display: inline-block; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; }
  a.primary { background: var(--primary, #7c6cfa); color: #fff; }
  a.ghost { color: var(--text-primary, #e6e6ef); border: 1px solid var(--border, rgba(255,255,255,.12)); }
</style>
</head>
<body>
  <div class="card">
    <h1>This page isn't saved yet</h1>
    <p>You're offline, and this page hasn't been opened on this computer before. Your packs are saved, so you can keep studying from your library.</p>
    <div class="row">
      <a class="primary" href="/dashboard">Go to my packs</a>
      <a class="ghost" href="javascript:location.reload()">Try again</a>
    </div>
  </div>
</body>
</html>
